<title>ChipWreck</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Real cards, digital chips. Texas Hold'em chip tracking on your phone.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Jersey+15&display=swap">
<style>
/* ChipWreck theme. Layout: lobby = logo over a hero/menu grid; table = grid areas (head, pot, players, chips, stack, me, actions).
   One deliberate look: felt green, arcade ledges, CRT overlay. Flat fills + hard ledge shadows, no outlines. */
:root {
  color-scheme: dark;
  --felt: #3B7955;
  --felt-light: #4a8a63;
  --felt-dark: #33694c;
  --felt-edge: #336a4b;
  --pine: #2A4B40;
  --pine-deep: #16291f;
  --ink: #141a17;
  --ink-deep: #0c100e;
  --ink-soft: #1f2a24;
  --linen: #E3E7D8;
  --linen-shade: #d0d5c2;
  --mustard: #E3C35A;
  --mustard-edge: #a8892f;
  --brick: #B8432F;
  --brick-edge: #7a2a1d;
  --blue: #2F5D73;
  --blue-edge: #1c3a49;
  --steel: #839E9F;
  --sand: #CEC181;
  --sand-shade: #b5a967;
  --dark-text: #17201b;
  --placeholder: #5d6f66;
  --pixel: "Jersey 15", "Courier New", monospace;
  --ui: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --fringe: 1.5px 0 rgba(184,67,47,.45), -1.5px 0 rgba(47,93,115,.45);
}
html, body { min-height: 100%; }
body { margin: 0; background: var(--felt-dark); color: var(--linen); font-family: var(--ui); -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
button, input { font-family: inherit; color: inherit; }
button { cursor: pointer; }
input::placeholder { color: var(--placeholder); }
:focus-visible { outline: 3px solid var(--mustard); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

@keyframes cwDriftA{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(14vw,10vh) scale(1.15)}}
@keyframes cwDriftB{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-12vw,-8vh) scale(1.2)}}
@keyframes cwFlicker{0%,100%{opacity:.97}50%{opacity:1}52%{opacity:.9}54%{opacity:1}}
@keyframes cwPop{0%{opacity:0;transform:translate(-50%,12px) scale(.6)}20%{opacity:1;transform:translate(-50%,-4px) scale(1.2)}100%{opacity:0;transform:translate(-50%,-56px) scale(1)}}
@keyframes cwRiffle{0%,18%{transform:translate(0,0)}30%{transform:translate(calc(var(--dx) * .5),-10px)}46%,74%{transform:translate(var(--dx),var(--dy))}100%{transform:translate(0,0)}}
@keyframes cwBob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-6px) rotate(1.5deg)}}

/* ---------- SwirlBackground + CRTOverlay ---------- */
.swirl { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; background: var(--felt-dark); }
.swirl i { position: absolute; border-radius: 50%; }
.swirl .b1 { left: -20%; top: -30%; width: 80vw; height: 80vw; background: var(--felt); filter: blur(60px); animation: cwDriftA 26s ease-in-out infinite; }
.swirl .b2 { right: -25%; top: 10%; width: 70vw; height: 70vw; background: var(--pine); filter: blur(70px); animation: cwDriftB 32s ease-in-out infinite; }
.swirl .b3 { left: 10%; bottom: -40%; width: 75vw; height: 75vw; background: var(--felt-light); opacity: .7; filter: blur(70px); animation: cwDriftA 38s ease-in-out infinite reverse; }
.swirl .vg { inset: 0; border-radius: 0; background: radial-gradient(ellipse at center, transparent 45%, rgba(20,26,23,.55) 100%); }
.crt { position: fixed; inset: 0; z-index: 300; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(10,14,12,.16) 0 1px, transparent 1px 3px), repeating-linear-gradient(90deg, rgba(184,67,47,.035) 0 1px, rgba(59,121,85,.035) 1px 2px, rgba(47,93,115,.035) 2px 3px); animation: cwFlicker 4s steps(1) infinite; }
.crt-vig { position: fixed; inset: 0; z-index: 301; pointer-events: none; border-radius: 28px; box-shadow: inset 0 0 140px rgba(10,14,12,.65), inset 0 0 0 10px rgba(10,14,12,.5); background: radial-gradient(ellipse at 50% 40%, rgba(255,255,255,.04) 0%, transparent 60%); }

/* ---------- primitives ---------- */
.px { font-family: var(--pixel); font-weight: 400; letter-spacing: .03em; text-shadow: var(--fringe); }
.lbl { font-size: 12px; font-weight: 900; letter-spacing: .14em; color: var(--steel); text-transform: uppercase; }
.sec { font-size: 13px; font-weight: 900; letter-spacing: .16em; }
.panel { border-radius: 12px; background: var(--ink); box-shadow: 0 8px 0 var(--ink-deep); box-sizing: border-box; min-width: 0; }
.abtn { --edge: var(--pine-deep); --drop: 6px; border: 0; border-radius: 10px; font-family: var(--pixel); font-weight: 400; letter-spacing: .04em; box-shadow: 0 var(--drop) 0 var(--edge); transition: transform .05s; }
.abtn:active:not(:disabled) { transform: translateY(var(--drop)); box-shadow: none; }
.abtn:disabled { cursor: default; }
.abtn.mustard { background: var(--mustard); color: var(--ink); --edge: var(--mustard-edge); }
.abtn.dead { background: var(--pine); color: var(--steel); --edge: var(--pine-deep); }
.abtn.ink { background: var(--ink); color: var(--mustard); }
.abtn.linen { background: var(--linen); color: var(--dark-text); }
.abtn.pine { background: var(--pine); color: var(--linen); --edge: var(--pine-deep); }
.abtn.brick { background: var(--brick); color: var(--linen); --edge: var(--brick-edge); }
.abtn.blue { background: var(--blue); color: var(--linen); --edge: var(--blue-edge); }
.abtn.off { background: var(--ink-soft); color: var(--linen); --edge: var(--ink-deep); }
.textlink { background: none; border: 0; padding: 4px 0; color: var(--linen); font-size: 14px; font-weight: 800; text-decoration: underline; text-underline-offset: 3px; }
.field { height: 54px; border: 0; border-radius: 10px; background: var(--ink-deep); color: var(--linen); font-size: 17px; font-weight: 700; outline: none; padding: 0 16px; box-sizing: border-box; width: 100%; min-width: 0; box-shadow: inset 0 4px 0 rgba(0,0,0,.5); }
.field:focus { box-shadow: inset 0 0 0 3px var(--mustard); }
.errpill { padding: 10px 12px; border-radius: 10px; background: var(--brick); color: var(--linen); font-size: 14px; font-weight: 800; }

/* avatar glyph */
.av { border-radius: 50%; position: relative; overflow: hidden; flex: none; }
.av::before { content: ""; position: absolute; left: 50%; top: 20%; width: 36%; height: 36%; transform: translateX(-50%); border-radius: 50%; background: var(--glyph, var(--linen)); }
.av::after { content: ""; position: absolute; left: 50%; top: 62%; width: 68%; height: 60%; transform: translateX(-50%); border-radius: 50% 50% 0 0; background: var(--glyph, var(--linen)); }
.avwrap { position: relative; flex: none; }
.dbadge { position: absolute; right: -6px; bottom: -4px; width: 20px; height: 20px; border-radius: 50%; background: var(--mustard); color: var(--ink); font-size: 10px; font-weight: 900; display: flex; align-items: center; justify-content: center; }

/* ChipStack3D */
.ch, .ch-side, .ch-face, .ch-in, .ch-shadow { position: absolute; }
.ch-side { left: 0; }
.ch-face { left: 0; top: 0; border-radius: 50%; }
.ch-in { border-radius: 50%; display: flex; align-items: center; justify-content: center; box-sizing: border-box; }
.ch-shadow { background: var(--pine); }
.art { position: absolute; top: 0; width: 800px; height: 420px; }
.art .abs { position: absolute; }

/* pops */
.pops { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
.pop { position: absolute; left: 50%; font-family: var(--pixel); color: var(--mustard); text-shadow: 0 4px 0 var(--ink); white-space: nowrap; animation: cwPop .95s ease-out forwards; }

/* ---------- lobby ---------- */
.lobby { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 36px; box-sizing: border-box; padding-block: 40px 64px; padding-left: max(48px, env(safe-area-inset-left, 0px)); padding-right: max(48px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.logo { margin: 0; font-family: var(--pixel); font-weight: 400; font-size: 132px; line-height: .85; letter-spacing: .02em; color: var(--mustard); text-shadow: 0 6px 0 var(--ink), 3px 0 rgba(184,67,47,.55), -3px 0 rgba(47,93,115,.55); animation: cwBob 4s ease-in-out infinite; }
.tags { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.tags span { padding: 6px 12px; border-radius: 10px; background: var(--ink); box-shadow: 0 4px 0 var(--ink-deep); font-size: 13px; font-weight: 900; letter-spacing: .12em; }
.lgrid { width: 100%; display: grid; grid-template-columns: minmax(0,1.35fr) minmax(0,1fr); gap: 28px; align-items: start; }
.hero { position: relative; width: 100%; aspect-ratio: 800 / 420; border-radius: 12px; background: var(--ink); box-shadow: 0 8px 0 var(--ink-deep); overflow: hidden; }
.hero .art { left: 0; transform: scale(var(--sc, .75)); transform-origin: top left; }
.lpanel { padding: 24px; display: flex; flex-direction: column; gap: 18px; }
.tabs, .seg { display: grid; gap: 10px; }
.tabs { grid-template-columns: 1fr 1fr; }
.tabs .abtn { height: 64px; font-size: 28px; --drop: 5px; }
.seg { grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
.seg .abtn { height: 48px; font-size: 24px; --drop: 4px; }
.flabel { display: flex; flex-direction: column; gap: 8px; }
.codein { height: 80px; font-family: var(--pixel); font-size: 56px; letter-spacing: .35em; text-align: center; text-transform: uppercase; color: var(--mustard); padding: 0 0 0 .35em; font-weight: 400; }
.submit { height: 70px; border-radius: 12px; font-size: 34px; letter-spacing: .05em; text-shadow: var(--fringe); }
.extras { display: flex; flex-wrap: wrap; gap: 4px 18px; }
.extras .textlink { font-size: 13px; color: var(--steel); }
.note { font-size: 14px; font-weight: 600; color: var(--steel); margin: 0; }
.roomhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; }
.tiles div { height: 84px; border-radius: 10px; background: var(--mustard); color: var(--ink); box-shadow: 0 5px 0 var(--mustard-edge); display: flex; align-items: center; justify-content: center; font-family: var(--pixel); font-size: 64px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
.stat { border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; align-items: center; min-width: 0; }
.stat b { font-size: 11px; font-weight: 900; letter-spacing: .1em; }
.stat span { font-family: var(--pixel); font-size: 30px; line-height: 1; white-space: nowrap; }
.stat.blue { background: var(--blue); box-shadow: 0 4px 0 var(--blue-edge); }
.stat.brick { background: var(--brick); box-shadow: 0 4px 0 var(--brick-edge); }
.stat.pine { background: var(--pine); box-shadow: 0 4px 0 var(--pine-deep); }
.rplayers { display: flex; flex-direction: column; gap: 6px; }
.rp { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 10px; background: var(--ink-soft); }
.rp .av { width: 34px; height: 34px; }
.rp .nm { flex: 1; min-width: 0; font-size: 16px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rp .tag { font-family: var(--pixel); font-size: 20px; padding: 2px 10px; border-radius: 8px; }
.addrow { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px; }
.addrow .abtn { height: 54px; padding: 0 18px; font-size: 22px; --drop: 4px; }

/* ---------- table ---------- */
.tbl { position: relative; z-index: 1; max-width: 1280px; margin: 0 auto; display: grid; gap: 20px; align-items: stretch; box-sizing: border-box;
  grid-template-columns: minmax(0,1fr) minmax(0,2fr) minmax(0,1fr);
  grid-template-areas: "head head head" "pot pot players" "chips stack me" "actions actions actions";
  padding-block: 20px 28px; padding-left: max(36px, env(safe-area-inset-left, 0px)); padding-right: max(36px, env(safe-area-inset-right, 0px)); }
.thead { grid-area: head; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.brandbtn { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; color: var(--linen); }
.mini-chip { width: 30px; height: 30px; border-radius: 50%; background: repeating-conic-gradient(var(--mustard) 0deg 15deg, var(--ink) 15deg 45deg); display: flex; align-items: center; justify-content: center; }
.mini-chip i { width: 18px; height: 18px; border-radius: 50%; background: var(--ink); border: 1.5px solid var(--mustard); box-sizing: border-box; }
.hpills { display: flex; gap: 8px; font-size: 13px; font-weight: 800; letter-spacing: .04em; }
.hpills > * { padding: 8px 12px; border-radius: 10px; background: var(--pine); border: 0; color: var(--linen); font: inherit; font-size: 13px; font-weight: 800; letter-spacing: .04em; }
.tpot { grid-area: pot; min-width: 0; }
.stage { position: relative; height: 300px; border-radius: 12px; background: var(--ink); box-shadow: 0 8px 0 var(--pine-deep); overflow: hidden; }
.stage .art { left: 50%; margin-left: -400px; transform: scale(var(--sc, .7)); transform-origin: top center; }
.spill { position: absolute; top: 12px; padding: 8px 12px; border-radius: 10px; font-size: 14px; z-index: 3; }
.spill.turn { left: 12px; font-family: var(--pixel); letter-spacing: .04em; text-shadow: var(--fringe); transition: background .3s; }
.spill.street { right: 12px; background: var(--pine); font-weight: 900; letter-spacing: .06em; }
.slast { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; font-size: 13px; font-weight: 800; padding: 0 12px; z-index: 3; }
.potlabel { position: absolute; left: 250px; top: 306px; width: 300px; display: flex; align-items: baseline; justify-content: center; gap: 10px; }
.potlabel b { font-size: 16px; font-weight: 900; letter-spacing: .24em; color: var(--mustard); }
.potlabel span { font-size: 44px; line-height: 1; }
.potpile { position: absolute; left: 200px; top: 180px; width: 400px; height: 120px; display: flex; align-items: flex-end; justify-content: center; gap: 6px; }
.tplayers { grid-area: players; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.phead { display: flex; align-items: baseline; justify-content: space-between; }
.phead small { font-size: 12px; font-weight: 800; opacity: .8; }
.seats { flex: 1; display: grid; grid-template-columns: minmax(0,1fr); grid-auto-rows: 1fr; gap: 16px; }
.seat { border: 0; text-align: left; border-radius: 12px; background: var(--linen); color: var(--dark-text); box-shadow: 0 6px 0 var(--pine-deep); padding: 10px 14px; display: flex; align-items: center; gap: 12px; transition: all .3s; min-width: 0; box-sizing: border-box; font: inherit; }
.seat.hot { background: var(--mustard); box-shadow: 0 8px 0 var(--pine-deep); }
.seat.dim { opacity: .5; }
.seat .av { width: 52px; height: 52px; }
.seat .who { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.seat .nm { font-weight: 900; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seat .st, .seat .of { font-size: 12px; font-weight: 700; color: var(--pine); }
.seat .of { font-size: 11px; }
.seat .money { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
.seat .bet { font-size: 22px; line-height: 1; }
.empty-seats { border-radius: 12px; background: rgba(42,75,64,.35); padding: 16px; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-align: center; }
.tchips { grid-area: chips; display: flex; flex-direction: column; gap: 16px; }
.cardhead { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.tray { --ts: .8; flex: 1; display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; justify-items: center; align-content: center; }
.tchip { cursor: grab; touch-action: none; position: relative; width: calc(124px * var(--ts)); height: calc(110px * var(--ts)); border-radius: 12px; }
.tchip > div { position: absolute; left: 0; top: 0; width: 104px; height: 110px; transform: scale(var(--ts)); transform-origin: top left; }
.tchip.no { opacity: .35; cursor: default; }
.tstack { grid-area: stack; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.tstack .cardhead { width: 100%; }
.tstack .textlink { font-size: 13px; padding: 0; }
.zone { --zs: 1; position: relative; width: 100%; max-width: 420px; height: 230px; border-radius: 12px; background: rgba(42,75,64,.35); transition: background .2s; overflow: hidden; }
.zone.drag { background: rgba(227,195,90,.22); }
.zhint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 20px; font-size: 15px; font-weight: 800; letter-spacing: .04em; }
.ztotal { position: absolute; top: 14px; left: 0; right: 0; text-align: center; font-size: 40px; line-height: 1; }
.zstack { position: absolute; left: 50%; bottom: 22px; width: 170px; margin-left: -85px; transform: scale(var(--zs)); transform-origin: bottom center; }
.zchip { position: absolute; left: 0; width: 170px; height: 88px; cursor: grab; touch-action: none; }
.zchip .ch { top: 0 !important; }
.tme { grid-area: me; border-radius: 12px; background: var(--linen); color: var(--dark-text); box-shadow: 0 8px 0 var(--pine-deep); padding: 24px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; gap: 18px; transition: background .3s; min-width: 0; }
.tme.hot { background: var(--mustard); }
.merow { display: flex; align-items: center; gap: 12px; }
.tme .av { width: 56px; height: 56px; background: var(--ink); --glyph: var(--mustard); }
.tme .dbadge { box-shadow: 0 0 0 2px var(--linen); }
.mename { font-size: 18px; }
.mesub { font-size: 13px; font-weight: 700; color: var(--pine); }
.mestack { font-size: 44px; line-height: .9; }
.melink { background: none; border: 0; padding: 0; color: var(--dark-text); font-size: 13px; font-weight: 800; text-decoration: underline; text-align: left; }
.tactions { grid-area: actions; display: grid; grid-template-columns: 1fr 1fr 1fr 2fr; gap: 14px; }
.tactions .abtn { height: 64px; font-size: 17px; text-shadow: var(--fringe); }
.tactions .fold { color: var(--brick); }
.tactions .fold.sure { background: var(--brick); color: var(--linen); }
.tactions .play { font-size: 20px; }
.tactions .play.ok { background: var(--ink); color: var(--mustard); }
.tactions .play.no { background: var(--steel); color: var(--linen); }
.tbl.wait .tchips, .tbl.wait .tstack, .tbl.wait .tactions { opacity: .5; }
.tchips, .tstack, .tactions { transition: opacity .3s; }

/* modal + sheet */
.modal { position: fixed; inset: 0; background: rgba(20,26,23,.55); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50; box-sizing: border-box; }
.mcard { width: 100%; max-width: 440px; max-height: 100%; overflow-y: auto; background: var(--linen); color: var(--dark-text); border-radius: 12px; box-shadow: 0 8px 0 var(--pine-deep); padding: 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px; text-align: center; }
.mkick { font-size: 13px; font-weight: 900; letter-spacing: .2em; color: var(--pine); }
.mtitle { font-size: 34px; line-height: .95; }
.mamt { font-size: 72px; line-height: .85; color: var(--brick); }
.msub { font-size: 14px; font-weight: 700; color: var(--pine); margin: 0; }
.mpick { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
.mpick .abtn { height: 56px; font-size: 17px; text-shadow: var(--fringe); --drop: 0px; box-shadow: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 8px; }
.mpick .abtn.on { background: var(--mustard); color: var(--ink); }
.mpot { display: flex; flex-direction: column; gap: 8px; text-align: left; }
.mpot .lbl { color: var(--pine); display: flex; justify-content: space-between; }
.mgo { height: 60px; font-size: 18px; text-shadow: var(--fringe); --drop: 0px; box-shadow: none; }
.mlinks { display: flex; justify-content: center; gap: 18px; flex-wrap: wrap; }
.mlinks .melink { font-size: 14px; }
.sheetwrap { position: fixed; inset: 0; background: rgba(20,26,23,.55); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 60; box-sizing: border-box; }
.sheet { width: 100%; max-width: 480px; max-height: 100%; overflow-y: auto; padding: 22px; display: flex; flex-direction: column; gap: 14px; }
.sheet h3 { margin: 0; font-family: var(--pixel); font-weight: 400; font-size: 30px; line-height: 1; letter-spacing: .04em; color: var(--mustard); text-shadow: var(--fringe); }
.sheet h4 { margin: 4px 0 0; }
.sgrid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; }
.sgrid .abtn, .sheet .abtn.sm { height: 48px; font-size: 20px; --drop: 4px; padding: 0 8px; }
.ledger { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14px; }
.ledger th, .ledger td { padding: 8px 4px; text-align: right; border-bottom: 1px solid var(--ink-soft); }
.ledger th:first-child, .ledger td:first-child { text-align: left; }
.ledger th { font-size: 11px; font-weight: 900; letter-spacing: .1em; color: var(--steel); }
.ledger tr[data-a] { cursor: pointer; }
.ledger td:first-child { font-weight: 800; text-decoration: underline; text-underline-offset: 3px; }
.pos { color: #8fd3a6; } .neg { color: #f0a08f; }
.three { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
.three .field { height: 48px; font-size: 16px; padding: 0 10px; }
.logbox { font-size: 13px; color: var(--steel); display: grid; gap: 4px; max-height: 30vh; overflow-y: auto; }

<script>
/*
 * ChipStack engine — a pure reducer for Texas Hold'em chip handling.
 * Cards are physical; this only tracks stacks, blinds, bets, pots and turns.
 *
 * reduce(state, action) -> new state (throws Error with a readable message on an illegal action)
 * Every action carries { type, by } where `by` is the acting device's player id.
 */
(function (root) {
  'use strict';

  const STREETS = ['preflop', 'flop', 'turn', 'river', 'showdown'];
  const DEAL_HINT = {
    preflop: 'Deal two cards to each player',
    flop: 'Burn one, deal the flop (3 cards)',
    turn: 'Burn one, deal the turn (1 card)',
    river: 'Burn one, deal the river (1 card)',
    showdown: 'Show hands and pick the winner',
  };
  const HISTORY_MAX = 10;
  const LOG_MAX = 40;

  const clone = (o) => JSON.parse(JSON.stringify(o));
  const fail = (msg) => { throw new Error(msg); };

  function newTable({ code, hostId, hostName, startingStack = 1000, sb = 5, bb = 10 }) {
    if (!code) fail('Missing table code');
    const s = {
      code,
      version: 0,
      hostId,
      settings: { startingStack: int(startingStack), sb: int(sb), bb: int(bb) },
      players: [],
      buttonId: null,
      handNo: 0,
      hand: null,
      lastResult: null,
      log: [],
      history: [],
    };
    validateSettings(s.settings);
    if (hostId) addPlayer(s, hostId, hostName || 'Host');
    s.buttonId = hostId || null;
    return s;
  }

  function int(n) {
    const v = Math.floor(Number(n));
    return Number.isFinite(v) ? v : NaN;
  }

  function validateSettings(st) {
    if (!(st.startingStack > 0)) fail('Starting stack must be more than 0');
    if (!(st.sb > 0)) fail('Small blind must be more than 0');
    if (!(st.bb >= st.sb)) fail('Big blind must be at least the small blind');
  }

  function addPlayer(s, id, name) {
    const clean = String(name || '').trim().slice(0, 18) || 'Player';
    s.players.push({ id, name: clean, stack: s.settings.startingStack, buyIns: 1, sittingOut: false });
  }

  const player = (s, id) => s.players.find((p) => p.id === id);
  const eligible = (s) => s.players.filter((p) => p.stack > 0 && !p.sittingOut);
  const isHost = (s, id) => id === s.hostId || id === '*';
  const nameOf = (s, id) => (player(s, id) || { name: '?' }).name;

  function log(s, msg) {
    s.log.push(msg);
    if (s.log.length > LOG_MAX) s.log.splice(0, s.log.length - LOG_MAX);
  }

  // next id after `fromId` in `order` (cyclic) that passes `pred`
  function nextIn(order, fromId, pred) {
    const n = order.length;
    let i = order.indexOf(fromId);
    for (let k = 1; k <= n; k++) {
      const id = order[(i + k + n) % n];
      if (pred(id)) return id;
    }
    return null;
  }

  // ---------- pots ----------
  function computePots(hand) {
    const ids = hand.seats;
    const live = ids.filter((id) => !hand.folded[id]);
    const levels = [...new Set(live.map((id) => hand.committed[id] || 0))].filter((v) => v > 0).sort((a, b) => a - b);
    const pots = [];
    let prev = 0;
    for (const lvl of levels) {
      let amount = 0;
      for (const id of ids) {
        const c = hand.committed[id] || 0;
        amount += Math.max(0, Math.min(c, lvl) - Math.min(c, prev));
      }
      const elig = live.filter((id) => (hand.committed[id] || 0) >= lvl);
      if (amount > 0) {
        const last = pots[pots.length - 1];
        // merge pots with identical eligibility
        if (last && last.eligible.join() === elig.join()) last.amount += amount;
        else pots.push({ amount, eligible: elig });
      }
      prev = lvl;
    }
    // folded chips above the top live level (rare) go to the last pot
    let extra = 0;
    for (const id of ids) extra += Math.max(0, (hand.committed[id] || 0) - prev);
    if (extra && pots.length) pots[pots.length - 1].amount += extra;
    return pots;
  }

  const potTotal = (hand) => hand ? hand.seats.reduce((t, id) => t + (hand.committed[id] || 0), 0) : 0;

  // ---------- hand lifecycle ----------
  function post(s, h, id, amt) {
    const p = player(s, id);
    const a = Math.min(p.stack, amt);
    p.stack -= a;
    h.bets[id] = (h.bets[id] || 0) + a;
    h.committed[id] = (h.committed[id] || 0) + a;
    if (p.stack === 0) h.allIn[id] = true;
    return a;
  }

  function startHand(s) {
    if (s.hand) fail('A hand is already in progress');
    const elig = eligible(s);
    if (elig.length < 2) fail('Need at least 2 players with chips to deal');
    const order = s.players.map((p) => p.id);
    const isElig = (id) => elig.some((p) => p.id === id);
    let btn = s.buttonId;
    if (!btn || !isElig(btn)) btn = nextIn(order, btn || order[order.length - 1], isElig);
    const seats = order.filter(isElig);
    let sbId, bbId, firstToAct;
    if (seats.length === 2) {
      sbId = btn;
      bbId = nextIn(seats, btn, () => true);
      firstToAct = sbId;
    } else {
      sbId = nextIn(seats, btn, () => true);
      bbId = nextIn(seats, sbId, () => true);
      firstToAct = nextIn(seats, bbId, () => true);
    }
    s.handNo += 1;
    s.buttonId = btn;
    const h = {
      no: s.handNo,
      street: 'preflop',
      seats,
      buttonId: btn,
      sbId,
      bbId,
      bets: {},
      committed: {},
      folded: {},
      allIn: {},
      acted: {},
      last: {},
      currentBet: 0,
      minRaise: s.settings.bb,
      toAct: null,
    };
    s.hand = h;
    s.lastResult = null;
    const sbAmt = post(s, h, sbId, s.settings.sb);
    const bbAmt = post(s, h, bbId, s.settings.bb);
    h.last[sbId] = 'Small blind';
    h.last[bbId] = 'Big blind';
    h.currentBet = s.settings.bb; // a short blind still means others call the full big blind
    log(s, `Hand #${h.no}: ${nameOf(s, btn)} has the button. Blinds ${sbAmt}/${bbAmt}.`);
    h.toAct = firstToAct;
    // if first-to-act can't act, let advance() find the right player
    advance(s, firstToAct, true);
  }

  function canAct(h, id) { return !h.folded[id] && !h.allIn[id]; }

  function advance(s, lastId, initial) {
    const h = s.hand;
    const live = h.seats.filter((id) => !h.folded[id]);
    if (live.length === 1) return winUncontested(s, live[0]);
    const actors = live.filter((id) => canAct(h, id));
    const needs = (id) => canAct(h, id) && (!h.acted[id] || (h.bets[id] || 0) < h.currentBet);
    let roundDone;
    if (actors.length === 0) roundDone = true;
    else if (actors.length === 1 && (h.bets[actors[0]] || 0) >= h.currentBet) roundDone = true;
    else roundDone = actors.every((id) => !needs(id));

    if (!roundDone) {
      if (initial && needs(lastId)) { h.toAct = lastId; return; }
      h.toAct = nextIn(h.seats, lastId, needs);
      return;
    }
    // close the street
    h.bets = {};
    h.acted = {};
    h.last = {};
    h.currentBet = 0;
    h.minRaise = s.settings.bb;
    const idx = STREETS.indexOf(h.street);
    const runout = actors.length <= 1;
    if (h.street === 'river' || runout) {
      h.runout = runout && h.street !== 'river';
      h.street = 'showdown';
      h.toAct = null;
      h.pots = computePots(h);
      log(s, runout ? 'All in — run out the board, then show hands.' : 'Showdown — show hands.');
      // auto-award pots with a single eligible player (uncalled chips)
      autoAwardSingles(s);
      return;
    }
    h.street = STREETS[idx + 1];
    log(s, `${cap(h.street)}. ${DEAL_HINT[h.street]}.`);
    h.toAct = nextIn(h.seats, h.buttonId, (id) => canAct(h, id)) ;
    // in case button isn't in seats order (can't happen) fall back
    if (!h.toAct) h.toAct = actors[0];
  }

  function autoAwardSingles(s) {
    const h = s.hand;
    const keep = [];
    for (const pot of h.pots) {
      if (pot.eligible.length === 1) {
        player(s, pot.eligible[0]).stack += pot.amount;
        log(s, `${nameOf(s, pot.eligible[0])} takes back ${pot.amount} uncalled.`);
      } else keep.push(pot);
    }
    h.pots = keep;
    if (keep.length === 0) finishHand(s, []);
  }

  function winUncontested(s, id) {
    const h = s.hand;
    const amt = potTotal(h);
    player(s, id).stack += amt;
    log(s, `${nameOf(s, id)} wins ${amt} (everyone else folded).`);
    finishHand(s, [{ id, amount: amt }]);
  }

  function finishHand(s, wins) {
    const h = s.hand;
    s.lastResult = { handNo: h.no, wins };
    s.hand = null;
    // move button for the next hand
    const order = s.players.map((p) => p.id);
    const nextBtn = nextIn(order, h.buttonId, (id) => {
      const p = player(s, id);
      return p && p.stack > 0 && !p.sittingOut;
    });
    s.buttonId = nextBtn || h.buttonId;
  }

  function award(s, winnersPerPot) {
    const h = s.hand;
    if (!h || h.street !== 'showdown') fail('Nothing to award yet');
    if (!Array.isArray(winnersPerPot) || winnersPerPot.length !== h.pots.length) fail('Pick a winner for every pot');
    const totals = {};
    h.pots.forEach((pot, i) => {
      const ws = (winnersPerPot[i] || []).filter((id) => pot.eligible.includes(id));
      if (!ws.length) fail(`Pick a winner for ${h.pots.length > 1 ? (i === 0 ? 'the main pot' : 'side pot ' + i) : 'the pot'}`);
      // odd chips go to the first winner left of the button
      const ordered = [];
      let cur = h.buttonId;
      for (let k = 0; k < h.seats.length; k++) {
        cur = nextIn(h.seats, cur, () => true);
        if (ws.includes(cur) && !ordered.includes(cur)) ordered.push(cur);
      }
      const share = Math.floor(pot.amount / ordered.length);
      let rem = pot.amount - share * ordered.length;
      for (const id of ordered) {
        const amt = share + (rem > 0 ? 1 : 0);
        if (rem > 0) rem--;
        totals[id] = (totals[id] || 0) + amt;
      }
    });
    const wins = Object.entries(totals).map(([id, amount]) => {
      player(s, id).stack += amount;
      return { id, amount };
    });
    log(s, wins.map((w) => `${nameOf(s, w.id)} wins ${w.amount}`).join(', ') + '.');
    finishHand(s, wins);
  }

  // ---------- betting ----------
  function act(s, a) {
    const h = s.hand;
    if (!h || h.street === 'showdown') fail('No betting right now');
    const id = h.toAct;
    if (a.by !== id && !isHost(s, a.by)) fail(`It's ${nameOf(s, id)}'s turn`);
    if (a.player && a.player !== id) fail('Turn moved on — try again');
    const p = player(s, id);
    const mine = h.bets[id] || 0;
    const toCall = h.currentBet - mine;
    const who = p.name;
    let label = 'Waiting';
    switch (a.type) {
      case 'fold':
        h.folded[id] = true;
        label = 'Folded';
        log(s, `${who} folds.`);
        break;
      case 'check':
        if (toCall > 0) fail(`Can't check — ${toCall} to call`);
        label = 'Checked';
        log(s, `${who} checks.`);
        break;
      case 'call': {
        if (toCall <= 0) fail('Nothing to call — check instead');
        const amt = post(s, h, id, toCall);
        label = 'Called';
        log(s, `${who} calls ${amt}${h.allIn[id] ? ' (all in)' : ''}.`);
        break;
      }
      case 'raise': {
        // a.to = total bet for this street after the action
        const to = int(a.to);
        const maxTo = mine + p.stack;
        if (!(to > h.currentBet)) fail(h.currentBet ? `Raise must be more than ${h.currentBet}` : 'Bet must be more than 0');
        if (to > maxTo) fail(`You only have ${p.stack}`);
        const size = to - h.currentBet;
        const allIn = to === maxTo;
        const minTo = h.currentBet + h.minRaise;
        if (size < h.minRaise && !allIn) fail(`Minimum ${h.currentBet ? 'raise is to' : 'bet is'} ${minTo}`);
        const wasBet = h.currentBet === 0;
        post(s, h, id, to - mine);
        if (size >= h.minRaise) {
          h.minRaise = size;
          h.acted = {};
        }
        h.currentBet = to;
        label = wasBet ? 'Bet' : 'Raised';
        log(s, `${who} ${wasBet ? 'bets' : 'raises to'} ${to}${allIn ? ' (all in)' : ''}.`);
        break;
      }
      default:
        fail('Unknown action');
    }
    h.acted[id] = true;
    if (!h.last) h.last = {};
    h.last[id] = h.allIn[id] ? 'All in' : label;
    advance(s, id);
  }

  // ---------- reducer ----------
  function reduce(prev, a) {
    if (!a || !a.type) fail('Missing action');
    const s = clone(prev);
    const snapshot = () => {
      const snap = clone(prev);
      delete snap.history;
      s.history.push(snap);
      if (s.history.length > HISTORY_MAX) s.history.splice(0, s.history.length - HISTORY_MAX);
    };
    const host = isHost(s, a.by);
    const noHand = () => { if (s.hand) fail('Finish the current hand first'); };

    switch (a.type) {
      case 'join': {
        if (player(s, a.by)) {
          if (a.name) player(s, a.by).name = String(a.name).trim().slice(0, 18) || player(s, a.by).name;
          break;
        }
        if (s.players.length >= 10) fail('Table is full (10 players)');
        addPlayer(s, a.by, a.name);
        if (!s.hostId) s.hostId = a.by;
        if (!s.buttonId) s.buttonId = a.by;
        log(s, `${nameOf(s, a.by)} joined with ${s.settings.startingStack}.`);
        break;
      }
      case 'leave': {
        const target = a.player || a.by;
        if (target !== a.by && !host) fail('Only the host can remove players');
        if (s.hand && s.hand.seats.includes(target)) fail('Wait until this hand ends');
        const p = player(s, target);
        if (!p) break;
        snapshot();
        if (s.buttonId === target) {
          const order = s.players.map((x) => x.id);
          s.buttonId = nextIn(order, target, (id) => id !== target);
        }
        s.players = s.players.filter((x) => x.id !== target);
        if (s.hostId === target) s.hostId = s.players[0] ? s.players[0].id : null;
        log(s, `${p.name} left with ${p.stack}.`);
        break;
      }
      case 'sitOut': {
        const target = a.player || a.by;
        if (target !== a.by && !host) fail('Only the host can do that');
        const p = player(s, target);
        if (!p) fail('Not at this table');
        p.sittingOut = !!a.value;
        log(s, `${p.name} ${p.sittingOut ? 'sits out' : 'is back in'}.`);
        break;
      }
      case 'move': {
        noHand();
        const i = s.players.findIndex((p) => p.id === a.player);
        const j = i + (a.dir < 0 ? -1 : 1);
        if (i < 0 || j < 0 || j >= s.players.length) break;
        [s.players[i], s.players[j]] = [s.players[j], s.players[i]];
        break;
      }
      case 'button': {
        noHand();
        if (!player(s, a.player)) fail('Not at this table');
        s.buttonId = a.player;
        log(s, `Button moved to ${nameOf(s, a.player)}.`);
        break;
      }
      case 'rebuy': {
        const target = a.player || a.by;
        if (target !== a.by && !host) fail('Only the host can add chips for someone else');
        if (s.hand && s.hand.seats.includes(target)) fail('Rebuy between hands');
        const p = player(s, target);
        if (!p) fail('Not at this table');
        snapshot();
        p.stack += s.settings.startingStack;
        p.buyIns += 1;
        log(s, `${p.name} buys in again (+${s.settings.startingStack}).`);
        break;
      }
      case 'adjust': {
        if (!host) fail('Only the host can adjust stacks');
        noHand();
        const p = player(s, a.player);
        if (!p) fail('Not at this table');
        const v = int(a.stack);
        if (!(v >= 0)) fail('Stack must be 0 or more');
        snapshot();
        log(s, `Host set ${p.name}'s stack ${p.stack} → ${v}.`);
        p.stack = v;
        break;
      }
      case 'settings': {
        if (!host) fail('Only the host can change blinds');
        noHand();
        const st = { startingStack: int(a.startingStack ?? s.settings.startingStack), sb: int(a.sb ?? s.settings.sb), bb: int(a.bb ?? s.settings.bb) };
        validateSettings(st);
        s.settings = st;
        log(s, `Blinds now ${st.sb}/${st.bb}, buy-in ${st.startingStack}.`);
        break;
      }
      case 'deal':
        snapshot();
        startHand(s);
        break;
      case 'fold':
      case 'check':
      case 'call':
      case 'raise':
        snapshot();
        act(s, a);
        break;
      case 'award':
        snapshot();
        award(s, a.winners);
        break;
      case 'undo': {
        if (!host) fail('Only the host can undo');
        const last = s.history.pop();
        if (!last) fail('Nothing to undo');
        const hist = s.history;
        const restored = clone(last);
        restored.history = hist;
        restored.version = s.version;
        restored.log = (restored.log || []).concat();
        log(restored, 'Host undid the last action.');
        return bump(restored);
      }
      default:
        fail('Unknown action ' + a.type);
    }
    return bump(s);
  }

  function bump(s) { s.version = (s.version || 0) + 1; s.updatedAt = Date.now(); return s; }
  function cap(w) { return w.charAt(0).toUpperCase() + w.slice(1); }

  // ---------- helpers for UI ----------
  function legal(s, id) {
    const h = s.hand;
    if (!h || h.street === 'showdown' || h.toAct !== id) return null;
    const p = player(s, id);
    const mine = h.bets[id] || 0;
    const toCall = Math.max(0, h.currentBet - mine);
    const maxTo = mine + p.stack;
    const minTo = Math.min(maxTo, h.currentBet + h.minRaise);
    return {
      toCall: Math.min(toCall, p.stack),
      canCheck: toCall === 0,
      canRaise: maxTo > h.currentBet && (p.stack > toCall),
      minTo,
      maxTo,
      mine,
      isBet: h.currentBet === 0,
      pot: potTotal(h),
      currentBet: h.currentBet,
    };
  }

  const api = { newTable, reduce, legal, computePots, potTotal, STREETS, DEAL_HINT };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.ChipEngine = api;
})(typeof self !== 'undefined' ? self : this);

</script>
<script>
/*
 * Sync backends. Each exposes:
 *   kind, me ({id}), create(settings, name) -> code, open(code), submit(action) -> state,
 *   onState(cb), online (Set of player ids, optional), close()
 *
 * - ClaudeBackend: when the page runs as a claude.ai artifact (shared db doc + room pokes)
 * - PeerBackend:   when hosted anywhere else (GitHub Pages) — host's phone runs the game, public MQTT brokers relay
 * - LocalBackend:  one phone for the whole table (pass-and-play), stored in this browser
 */
(function (root) {
  'use strict';
  const E = root.ChipEngine;
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const CODE_ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const makeCode = () => Array.from({ length: 4 }, () => CODE_ALPHABET[Math.floor(Math.random() * CODE_ALPHABET.length)]).join('');
  const rid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* ignore */ } },
    del(k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } },
  };

  const sess = {
    get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { sessionStorage.setItem(k, v); } catch (e) { /* ignore */ } },
  };

  class Emitter {
    constructor() { this.subs = new Set(); this.state = null; this.online = new Set(); this.onlineSubs = new Set(); }
    onState(cb) { this.subs.add(cb); if (this.state) cb(this.state); return () => this.subs.delete(cb); }
    onOnline(cb) { this.onlineSubs.add(cb); return () => this.onlineSubs.delete(cb); }
    push(s) {
      if (!s) return;
      if (this.state && this.state.code === s.code && (s.version || 0) < (this.state.version || 0)) return;
      this.state = s;
      this.subs.forEach((cb) => cb(s));
    }
    setOnline(set) { this.online = set; this.onlineSubs.forEach((cb) => cb(set)); }
  }

  // ---------------- claude.ai artifact backend ----------------
  class ClaudeBackend extends Emitter {
    constructor(db, user, room) {
      super();
      this.kind = 'claude';
      this.db = db; this.user = user; this.room = room;
      this.tab = rid();
    }
    async init() {
      const id = this.user ? await this.user.id() : null;
      if (!id) throw new Error('Sign in to claude.ai to join a table.');
      this.me = { id: 'u' + String(id).replace(/[^A-Za-z0-9_-]/g, '').slice(0, 40) };
      return this;
    }
    ref(code) { return this.db.doc('tables/' + code); }
    async withLease(code, fn) {
      const ref = this.ref(code);
      for (let i = 0; i < 40; i++) {
        let r;
        try { r = await ref.acquire({ holder: this.me.id + ':' + this.tab, ttlMs: 1500 }); }
        catch (e) { if (e && e.code === 'unavailable') { await sleep(300); continue; } throw dbErr(e); }
        if (r && r.acquired) {
          const snap = await ref.get();
          const cur = snap.exists ? snap.data() : null;
          const next = fn(cur && cur.code ? cur : null);
          if (!next) return cur;
          try { await ref.set(next); } catch (e) { throw dbErr(e); }
          this.push(next);
          this.poke(next.version);
          return next;
        }
        await sleep(150 + Math.random() * 250);
      }
      throw new Error('The table is busy — try again.');
    }
    async create(settings, name) {
      for (let tries = 0; tries < 5; tries++) {
        const code = makeCode();
        let taken = false;
        await this.withLease(code, (cur) => {
          if (cur) { taken = true; return null; }
          return E.newTable({ code, hostId: this.me.id, hostName: name, ...settings });
        });
        if (!taken) { await this.open(code); return code; }
      }
      throw new Error('Could not make a table code — try again.');
    }
    async open(code) {
      this.close();
      this.code = code;
      const ref = this.ref(code);
      const snap = await ref.get();
      if (!snap.exists || !(snap.data() || {}).code) throw new Error(`No table with code ${code}.`);
      this.push(snap.data());
      this.unsub = ref.onSnapshot((s) => { const d = s.exists ? s.data() : null; if (d && d.code) this.push(d); }, () => {});
      if (this.room) {
        try {
          this.r = await this.room.join('t-' + code.toLowerCase());
          this.offPoke = this.r.on('poke', async (m) => {
            if (m && m.isMe) return;
            const v = m && m.data && m.data.v;
            if (this.state && v && v <= this.state.version) return;
            try { const s = await ref.get(); if (s.exists) this.push(s.data()); } catch (e) { /* ignore */ }
          });
          this.r.presence({ pid: this.me.id }).catch(() => {});
          this.offPeers = this.r.onPeers(() => {
            const set = new Set();
            for (const p of this.r.peers()) if (p.presence && typeof p.presence.pid === 'string') set.add(p.presence.pid);
            this.setOnline(set);
          });
        } catch (e) { this.r = null; }
      }
    }
    poke(v) { if (this.r) this.r.emit('poke', { v }).catch(() => {}); }
    submit(action) {
      return this.withLease(this.code, (cur) => {
        if (!cur) throw new Error('This table no longer exists.');
        return E.reduce(cur, { ...action, by: this.me.id });
      });
    }
    close() {
      if (this.unsub) this.unsub();
      if (this.offPoke) this.offPoke();
      if (this.offPeers) this.offPeers();
      if (this.r) this.r.leave().catch(() => {});
      this.unsub = this.offPoke = this.offPeers = this.r = null;
      this.state = null;
    }
  }
  function dbErr(e) {
    if (e instanceof Error) return e;
    if (e && e.code === 'invalid_argument') return new Error('You can view this table but not play. Ask the owner for edit access.');
    if (e && e.code === 'quota_exceeded') return new Error('Storage is full. Delete old tables.');
    return new Error((e && e.message) || 'Something went wrong syncing the table.');
  }

  // ---------------- Broker backend (host phone runs the game, public MQTT brokers relay messages) ----------------
  // Every device connects to several free public MQTT brokers at once and sends each message
  // through all of them, so one broker being down doesn't break the table.
  //   chipstack/v2/<CODE>/state   retained, published by the host: the latest table state
  //   chipstack/v2/<CODE>/in      players -> host: hello, act, ping
  //   chipstack/v2/<CODE>/to/<tab> host -> one player: welcome, ok, err
  //   chipstack/v2/<CODE>/lock    retained: which tab is hosting, so a second host tab stands down
  const BROKERS = [
    'wss://broker.emqx.io:8084/mqtt',
    'wss://broker.hivemq.com:8884/mqtt',
    'wss://test.mosquitto.org:8081',
  ];
  const brokerList = () => root.CHIPSTACK_BROKERS || BROKERS; // tests point this at a local broker
  const TOPIC = (code) => 'chipstack/v2/' + code;
  let mqttLib = null;
  function loadMqtt() {
    if (root.mqtt) return Promise.resolve(root.mqtt);
    if (mqttLib) return mqttLib;
    mqttLib = new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js';
      s.onload = () => res(root.mqtt);
      s.onerror = () => { mqttLib = null; rej(new Error('Could not load the connection library. Check your internet.')); };
      document.head.appendChild(s);
    });
    return mqttLib;
  }

  class Relay {
    // a bundle of broker connections that behaves like one pub/sub link
    constructor(onMessage) { this.clients = []; this.onMessage = onMessage; this.subs = new Set(); }
    async connect() {
      const lib = await loadMqtt();
      const tries = brokerList().map((url) => new Promise((res) => {
        let done = false;
        const c = lib.connect(url, {
          clientId: 'cs_' + rid(), clean: true, keepalive: 30, connectTimeout: 7000,
          reconnectPeriod: 2500, protocolVersion: 4,
        });
        c.on('connect', () => {
          this.subs.forEach((t) => c.subscribe(t, { qos: 0 }));
          if (!done) { done = true; res(c); }
        });
        c.on('message', (topic, payload) => {
          let msg; try { msg = JSON.parse(payload.toString()); } catch (e) { return; }
          this.onMessage(topic, msg);
        });
        c.on('error', () => {});
        setTimeout(() => { if (!done) { done = true; res(c); } }, 8000); // keep trying in background
      }));
      this.clients = await Promise.all(tries);
      if (!this.clients.some((c) => c.connected)) {
        // give slow networks one more moment
        await sleep(3000);
        if (!this.clients.some((c) => c.connected)) { this.end(); throw new Error("Can't reach the game relay. Check your internet connection and try again."); }
      }
      return this;
    }
    sub(topic) { this.subs.add(topic); this.clients.forEach((c) => c.connected && c.subscribe(topic, { qos: 0 })); }
    pub(topic, msg, retain) {
      const body = JSON.stringify(msg);
      this.clients.forEach((c) => { if (c.connected) c.publish(topic, body, { qos: 0, retain: !!retain }); });
    }
    get up() { return this.clients.some((c) => c.connected); }
    end() { this.clients.forEach((c) => { try { c.end(true); } catch (e) { /* ignore */ } }); this.clients = []; this.subs.clear(); }
  }

  class PeerBackend extends Emitter {
    constructor() {
      super();
      this.kind = 'peer';
      // One identity per browser TAB (sessionStorage survives a refresh), so two tabs or two
      // friends on one browser get separate seats. The host confirms the id on join.
      this.tab = sess.get('chipstack:tab') || rid();
      sess.set('chipstack:tab', this.tab);
      this.me = { id: sess.get('chipstack:pid') || ('p' + rid()) };
      sess.set('chipstack:pid', this.me.id);
      this.pending = new Map();
      this.seen = new Set();
      this.players = new Map(); // host: tab -> { pid, at }
    }
    async init() { await loadMqtt(); return this; }
    hostedCodes() {
      try { return JSON.parse(store.get('chipstack:hosted') || '[]'); } catch (e) { return []; }
    }

    async link(code) {
      this.close();
      this.code = code;
      this.base = TOPIC(code);
      this.retained = null;
      this.relay = new Relay((topic, msg) => this.onMessage(topic, msg));
      this.relay.sub(this.base + '/state');
      this.relay.sub(this.base + '/to/' + this.tab);
      this.relay.sub(this.base + '/lock');
      await this.relay.connect();
    }
    waitForState(ms) {
      return new Promise((res) => {
        if (this.retained) return res(this.retained);
        const t0 = Date.now();
        const iv = setInterval(() => {
          if (this.retained || Date.now() - t0 > ms) { clearInterval(iv); res(this.retained); }
        }, 100);
      });
    }

    onMessage(topic, msg) {
      if (!msg || typeof msg !== 'object') return;
      if (msg.id) { if (this.seen.has(msg.id)) return; this.seen.add(msg.id); if (this.seen.size > 500) this.seen = new Set([...this.seen].slice(-250)); }
      if (topic === this.base + '/state') {
        if (!msg.state || msg.state.code !== this.code) return;
        if (!this.retained || (msg.state.version || 0) >= (this.retained.version || 0)) this.retained = msg.state;
        if (!this.isHost) this.push(msg.state);
        return;
      }
      if (topic === this.base + '/lock') {
        if (this.isHost && msg.tab && msg.tab !== this.tab && msg.at > this.hostSince) {
          this.isHost = false; this.stoodDown = true;
          this.relay.sub(this.base + '/state');
        }
        return;
      }
      if (topic === this.base + '/to/' + this.tab) {
        if (msg.t === 'welcome') {
          this.me.id = msg.pid;
          sess.set('chipstack:pid', msg.pid);
          store.set('chipstack:seat:' + this.code, msg.pid);
          if (this.welcomed) this.welcomed();
          return;
        }
        const p = this.pending.get(msg.rid);
        if (!p) return;
        this.pending.delete(msg.rid);
        msg.t === 'ok' ? p.res(this.state) : p.rej(new Error(msg.msg || 'Something went wrong'));
        return;
      }
      if (topic === this.base + '/in' && this.isHost) this.hostHandle(msg);
    }

    // ----- host side -----
    async create(settings, name) {
      for (let tries = 0; tries < 5; tries++) {
        const code = makeCode();
        await this.link(code);
        const existing = await this.waitForState(1500);
        if (existing) continue; // code used before: pick another
        this.becomeHost(E.newTable({ code, hostId: this.me.id, hostName: name, ...settings }));
        return code;
      }
      throw new Error('Could not make a table code — try again.');
    }
    becomeHost(state) {
      this.isHost = true;
      this.hostSince = Date.now();
      this.relay.sub(this.base + '/in');
      this.relay.pub(this.base + '/lock', { id: rid(), tab: this.tab, at: this.hostSince }, true);
      this.state = null;
      this.apply(state);
      clearInterval(this.onlineTimer);
      this.onlineTimer = setInterval(() => this.updateOnline(), 5000);
      this.updateOnline();
    }
    apply(next) {
      this.push(next);
      this.save();
      this.relay.pub(this.base + '/state', { id: rid(), state: next }, true);
    }
    save() {
      if (!this.isHost || !this.state) return;
      store.set('chipstack:host:' + this.code, JSON.stringify(this.state));
      const list = this.hostedCodes().filter((c) => c !== this.code);
      list.unshift(this.code);
      store.set('chipstack:hosted', JSON.stringify(list.slice(0, 5)));
    }
    reply(tab, msg) { this.relay.pub(this.base + '/to/' + tab, { id: rid(), ...msg }); }
    hostHandle(msg) {
      const tab = typeof msg.tab === 'string' ? msg.tab.slice(0, 40) : null;
      if (!tab) return;
      const now = Date.now();
      const validPid = (p) => typeof p === 'string' && /^p[a-z0-9]{6,30}$/.test(p);
      const takenByOther = (pid) => pid === this.me.id || [...this.players].some(([t, v]) => t !== tab && v.pid === pid && now - v.at < 45000);
      if (msg.t === 'hello') {
        let pid = validPid(msg.pid) ? msg.pid : 'p' + rid();
        if (takenByOther(pid)) pid = 'p' + rid();
        this.players.set(tab, { pid, at: now });
        this.reply(tab, { t: 'welcome', pid });
        this.relay.pub(this.base + '/state', { id: rid(), state: this.state }, true);
        this.updateOnline();
        return;
      }
      if (!validPid(msg.pid)) return;
      const known = this.players.get(tab);
      if (!known) {
        if (takenByOther(msg.pid)) return this.reply(tab, { t: 'err', rid: msg.rid, msg: 'Rejoin the table to keep playing.' });
        this.players.set(tab, { pid: msg.pid, at: now });
      } else known.at = now;
      const pid = this.players.get(tab).pid;
      if (msg.t === 'ping') return;
      if (msg.t !== 'act' || !msg.action) return;
      try {
        const next = E.reduce(this.state, { ...msg.action, by: pid });
        this.apply(next);
        this.reply(tab, { t: 'ok', rid: msg.rid });
      } catch (e) { this.reply(tab, { t: 'err', rid: msg.rid, msg: e.message }); }
    }
    updateOnline() {
      const now = Date.now();
      const set = new Set([this.me.id]);
      this.players.forEach((v) => { if (now - v.at < 40000) set.add(v.pid); });
      this.setOnline(set);
    }

    // ----- player side -----
    async open(code) {
      const saved = store.get('chipstack:host:' + code);
      await this.link(code);
      const live = await this.waitForState(2500);
      if (saved) {
        // resume hosting from this phone's saved copy (or the relay's, if newer)
        const st = JSON.parse(saved);
        const best = live && (live.version || 0) > (st.version || 0) ? live : st;
        if (best.hostId) { this.me.id = best.hostId; sess.set('chipstack:pid', best.hostId); }
        this.becomeHost(best);
        return code;
      }
      if (!live) { this.close(); throw new Error(`No table with code ${code}. Check the code with the host.`); }
      this.push(live);
      await new Promise((res, rej) => {
        let settled = false;
        this.welcomed = () => { if (!settled) { settled = true; res(); } };
        const hello = () => this.relay.pub(this.base + '/in', { id: rid(), t: 'hello', tab: this.tab, pid: store.get('chipstack:seat:' + code) || this.me.id });
        hello();
        const again = setInterval(() => { if (settled) clearInterval(again); else hello(); }, 2500);
        setTimeout(() => {
          if (settled) return;
          settled = true; clearInterval(again);
          rej(new Error("The table exists but the host's phone isn't connected. Ask the host to open the app."));
        }, 12000);
      }).catch((e) => { this.close(); throw e; });
      clearInterval(this.pingTimer);
      this.pingTimer = setInterval(() => this.relay.pub(this.base + '/in', { id: rid(), t: 'ping', tab: this.tab, pid: this.me.id }), 15000);
      this.setOnline(new Set([this.me.id]));
      return code;
    }
    submit(action) {
      if (this.isHost) {
        const next = E.reduce(this.state, { ...action, by: this.me.id });
        this.apply(next);
        return Promise.resolve(next);
      }
      if (this.stoodDown) return Promise.reject(new Error('This table is being hosted from another tab.'));
      return new Promise((res, rej) => {
        if (!this.relay || !this.relay.up) return rej(new Error('Reconnecting…'));
        const id = rid();
        this.pending.set(id, { res, rej });
        this.relay.pub(this.base + '/in', { id: rid(), t: 'act', rid: id, tab: this.tab, pid: this.me.id, action });
        setTimeout(() => { if (this.pending.has(id)) { this.pending.delete(id); rej(new Error("The host didn't answer. Is the app open on their phone?")); } }, 9000);
      });
    }
    close() {
      clearInterval(this.pingTimer); clearInterval(this.onlineTimer);
      if (this.relay) this.relay.end();
      this.relay = null; this.isHost = false; this.stoodDown = false; this.welcomed = null;
      this.players = new Map(); this.retained = null;
      this.state = null;
    }
  }

  // ---------------- one-phone backend ----------------
  class LocalBackend extends Emitter {
    constructor() { super(); this.kind = 'local'; this.me = { id: '*' }; }
    async init() { return this; }
    async create(settings, name) {
      const code = 'HERE';
      const s = E.newTable({ code, hostId: 'h' + rid(), hostName: name, ...settings });
      this.state = null;
      this.push(s);
      this.save();
      return code;
    }
    async open() {
      const raw = store.get('chipstack:local');
      if (!raw) throw new Error('No saved one-phone table.');
      this.state = null;
      this.push(JSON.parse(raw));
    }
    save() { store.set('chipstack:local', JSON.stringify(this.state)); }
    async submit(action) {
      const a = { ...action, by: action.by || '*' };
      const next = E.reduce(this.state, a);
      this.push(next);
      this.save();
      return next;
    }
    close() { this.state = null; }
  }

  root.ChipTransport = { ClaudeBackend, PeerBackend, LocalBackend, makeCode, store, rid };
})(typeof self !== 'undefined' ? self : this);

</script>
<script>
/* ChipWreck UI — lobby, waiting room and table. Game rules live in engine.js; sync in transport.js.
 * Rendering: each screen mounts a skeleton once, then named regions are patched only when their HTML
 * changes, so CSS animations (riffle, logo bob) keep running and inputs keep focus. */
(function () {
  'use strict';
  const E = window.ChipEngine;
  const T = window.ChipTransport;
  const $app = document.getElementById('app');
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const money = (n) => '$' + Number(n || 0).toLocaleString('en-NZ');
  const UP = (s) => String(s || '').toUpperCase();

  // ---------------- design constants ----------------
  const CHIPS = [
    { v: 5, label: '$5', base: '#B8432F', stripe: '#E3C35A' },
    { v: 10, label: '$10', base: '#2F5D73', stripe: '#E3E7D8' },
    { v: 25, label: '$25', base: '#E3C35A', stripe: '#141a17' },
    { v: 100, label: '$100', base: '#141a17', stripe: '#E3C35A' },
  ];
  const byV = (v) => CHIPS.find((c) => c.v === v);
  const AVATAR = ['#141a17', '#B8432F', '#2F5D73', '#839E9F', '#3B7955'];
  const ROOM_COLORS = ['#E3C35A', '#B8432F', '#2F5D73', '#839E9F', '#3B7955'];
  const STREET = { preflop: 'PREFLOP', flop: 'FLOP', turn: 'TURN', river: 'RIVER', showdown: 'SHOWDOWN' };
  const STACK_OPTS = [500, 1000, 2000];
  const BLIND_OPTS = [[5, 10], [10, 20], [25, 50]];
  const PIXEL = "font-family:var(--pixel);font-weight:400;letter-spacing:.03em;text-shadow:var(--fringe)";
  // chip geometry per size (top face height, side band, stripe widths, inner inset, ring, stack offset, shadow offset)
  const SIZE = {
    pot:   { w: 76,  face: 32, ry: 16, sideH: 28, a: 10, b: 16, inset: '14% 12%', ring: 1.5, dk: .05, off: 11, sh: 10, label: 'font-size:13px;font-weight:900' },
    tray:  { w: 104, face: 44, ry: 22, sideH: 38, a: 13, b: 22, inset: '13% 12%', ring: 2,   dk: .06, off: 16, sh: 20, label: PIXEL + ';font-size:20px' },
    zone:  { w: 170, face: 68, ry: 34, sideH: 54, a: 20, b: 33, inset: '13% 11%', ring: 2,   dk: .06, off: 20, sh: 20, label: PIXEL + ';font-size:20px' },
    rif:   { w: 44,  face: 18, ry: 9,  sideH: 17, a: 6,  b: 10, inset: '18% 14%', ring: 0,   dk: .05 },
    lobby: { w: 60,  face: 26, ry: 13, sideH: 23, a: 8,  b: 13, inset: '16% 12%', ring: 0,   dk: .05, off: 9, sh: 8 },
  };
  function greedy(amount) {
    const r = []; let rem = amount;
    for (const d of [100, 25, 10, 5]) while (rem >= d) { r.push(d); rem -= d; }
    return r;
  }

  // ---------------- components (HTML builders) ----------------
  function chipHTML(c, P, top, label, extraStyle) {
    const hw = P.w / 2;
    return `<div class="ch" style="left:0;top:${top}px;width:${P.w}px;height:${P.ry + P.sideH}px;${extraStyle || ''}">` +
      `<div class="ch-side" style="top:${P.ry}px;width:${P.w}px;height:${P.sideH}px;border-radius:0 0 ${hw}px ${hw}px / 0 0 ${P.ry}px ${P.ry}px;background:linear-gradient(90deg,rgba(0,0,0,${P.dk}),rgba(0,0,0,.4)),repeating-linear-gradient(90deg,${c.base} 0 ${P.a}px,${c.stripe} ${P.a}px ${P.b}px)"></div>` +
      `<div class="ch-face" style="width:${P.w}px;height:${P.face}px;background:repeating-conic-gradient(${c.base} 0deg 20deg,${c.stripe} 20deg 30deg)">` +
      `<div class="ch-in" style="inset:${P.inset};background:${c.base};${P.ring ? `border:${P.ring}px solid ${c.stripe};` : ''}color:${c.stripe};${P.label || ''}">${label || ''}</div></div></div>`;
  }
  // ChipStack3D: n chips of one colour, value shown on the top chip only
  function stack3D(c, n, P, opts) {
    opts = opts || {};
    const h = P.ry + P.sideH + P.off * (n - 1);
    let out = `<div style="position:relative;width:${P.w}px;height:${h}px;flex:none">`;
    out += `<div class="ch-shadow" style="left:${P.sh}px;top:${P.sh}px;width:${P.w}px;height:${opts.shadowH || h}px;border-radius:${P.w / 2}px / ${P.ry}px"></div>`;
    for (let i = 0; i < n; i++) out += chipHTML(c, P, (n - 1 - i) * P.off, opts.noLabel || i !== n - 1 ? '' : (opts.labelFn ? opts.labelFn(c) : c.label));
    return out + '</div>';
  }
  function riffleHTML(left, top) {
    let kids = `<div class="abs" style="left:6px;top:74px;width:100px;height:20px;border-radius:50%;background:#2A4B40"></div>`;
    const one = (c, key, x, y, z, dx, dy, delay) =>
      `<div class="abs rif" style="left:${x}px;top:${y}px;width:44px;height:26px;z-index:${z};--dx:${dx}px;--dy:${dy}px;animation:cwRiffle 2.6s cubic-bezier(.6,0,.3,1) ${delay}s infinite">${chipHTML(c, SIZE.rif, 0, '')}</div>`;
    const red = { base: '#B8432F', stripe: '#E3C35A' }, blk = { base: '#141a17', stripe: '#E3C35A' };
    for (let i = 0; i < 5; i++) {
      kids += one(red, 'l' + i, 0, 64 - i * 7, 2 * i, 25, -i * 7, i * .05);
      kids += one(blk, 'r' + i, 50, 64 - i * 7, 2 * i + 1, -25, -(i + 1) * 7, i * .05 + .02);
    }
    return `<div class="abs" style="left:${left}px;top:${top}px;width:110px;height:100px">${kids}</div>`;
  }
  // DealerScene (head cropped by the frame); 'lobby' variant has red bow tie and brass studs

  const handsSVG = `<svg class="abs" width="800" height="420" viewBox="0 0 800 420" style="left:0;top:0" aria-hidden="true"><g transform="translate(80 0) scale(0.8)">
      <path d="M314 214 Q334 206 352 214 Q360 222 352 230 Q334 236 316 230 Q308 222 314 214Z" fill="#CEC181"/>
      <path d="M486 214 Q466 206 448 214 Q440 222 448 230 Q466 236 484 230 Q492 222 486 214Z" fill="#CEC181"/></g></svg>`;
  const tableHTML = `<div class="abs" style="left:-160px;top:170px;width:1120px;height:460px;border-radius:50%;background:#2A4B40"></div>
    <div class="abs" style="left:-142px;top:188px;width:1084px;height:424px;border-radius:50%;background:radial-gradient(ellipse at 50% 25%,#4a8a63 0%,#3B7955 45%,#336a4b 100%)"></div>
    <div class="abs" style="left:-90px;top:226px;width:980px;height:360px;border-radius:50%;border:2px solid rgba(227,195,90,.4);box-sizing:border-box"></div>`;
  const avatarHTML = (color, dealer, glyph) => `<div class="avwrap"><div class="av" style="background:${color}${glyph ? ';--glyph:' + glyph : ''}"></div>${dealer ? '<div class="dbadge">D</div>' : ''}</div>`;

  // ---------------- state ----------------
  let net = null, netReady = null, backend = null, S = null;
  let online = new Set();
  const ui = {
    view: 'lobby', tab: 'join', code: '', name: T.store.get('chipstack:name') || '', stack: 1000, blinds: 0,
    err: '', busy: false, homeNote: '', addName: '',
    staged: [], stageKey: '', confirmFold: false, actFor: false,
    picks: [], pickKey: '', split: false, sheet: null, sheetPlayer: null, confirmRemove: false,
  };
  let lastPot = null, lastPotHand = null;

  // ---------------- boot ----------------
  function boot() {
    const hash = (location.hash || '').replace('#', '').toUpperCase();
    if (/^[A-Z0-9]{4}$/.test(hash)) ui.code = hash;
    netReady = (async () => {
      if (window.claude && typeof window.claude.use === 'function') {
        const db = await window.claude.use('db');
        if (db) {
          const [user, room] = await Promise.all([window.claude.use('user'), window.claude.use('room')]);
          return new T.ClaudeBackend(db, user, room).init();
        }
      }
      return new T.PeerBackend().init();
    })();
    netReady.then((b) => { net = b; render(); }).catch((e) => { ui.homeNote = e.message; render(); });
    render();
  }

  // ---------------- helpers ----------------
  const meId = () => (backend ? backend.me.id : null);
  const isLocal = () => !!backend && backend.kind === 'local';
  const amHost = () => !!S && (isLocal() || S.hostId === meId());
  const P = (id) => S.players.find((p) => p.id === id);
  const nameOf = (id) => (P(id) || { name: '?' }).name;
  const isMobile = () => window.innerWidth < 700;
  const potTotal = () => E.potTotal(S.hand);
  const eligibleCount = () => S.players.filter((p) => p.stack > 0 && !p.sittingOut).length;

  function actorId() {
    const h = S && S.hand;
    if (!h || !h.toAct || h.street === 'showdown') return null;
    if (isLocal()) return h.toAct;
    if (h.toAct === meId()) return h.toAct;
    if (amHost() && ui.actFor) return h.toAct;
    return null;
  }
  // whose card sits in the "me" slot: you, or on one phone whoever is acting
  function viewerId() {
    if (isLocal()) return (S.hand && S.hand.toAct) || S.buttonId || (S.players[0] && S.players[0].id);
    return actorId() || meId();
  }

  let toastTimer;
  function toast(msg, bad) {
    let el = document.querySelector('.toast');
    if (!el) { el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
    el.textContent = msg;
    el.classList.toggle('bad', !!bad);
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.hidden = true; }, bad ? 3600 : 2200);
  }

  async function send(action) {
    if (ui.busy) return false;
    ui.busy = true;
    try { await backend.submit(action); return true; }
    catch (e) { toast(e.message, true); return false; }
    finally { ui.busy = false; render(); }
  }

  let wakeLock = null;
  function keepAwake() {
    if (wakeLock || !navigator.wakeLock || !S) return;
    navigator.wakeLock.request('screen').then((l) => { wakeLock = l; l.addEventListener('release', () => { wakeLock = null; }); }).catch(() => {});
  }
  document.addEventListener('pointerdown', keepAwake, { passive: true });
  const buzz = (p) => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) { /* ignore */ } };

  // ---------------- joining / creating ----------------
  let unsub = null;
  function attach(b) {
    if (unsub) unsub();
    backend = b;
    let lastTurn = null;
    const u1 = b.onState((s) => {
      S = s;
      if (ui.view === 'auto') ui.view = s.handNo > 0 || s.hand ? 'table' : 'room';
      else if (ui.view === 'room' && s.hand) ui.view = 'table';
      const turn = s.hand && s.hand.toAct;
      if (turn && turn !== lastTurn && turn === meId() && !isLocal()) buzz([60, 40, 60]);
      lastTurn = turn;
      trackPot();
      render();
    });
    const u2 = b.onOnline ? b.onOnline((set) => { online = set; render(); }) : () => {};
    unsub = () => { u1(); u2(); };
  }
  function trackPot() {
    const h = S.hand;
    if (!h || h.street === 'showdown') { lastPot = null; return; }
    const pot = E.potTotal(h);
    if (lastPot != null && lastPotHand === h.no && pot > lastPot) popAt('potPops', '+' + money(pot - lastPot), '30%', 44);
    lastPot = pot; lastPotHand = h.no;
  }

  function fail(msg) { ui.err = msg; ui.busy = false; render(); }

  async function submitLobby(local) {
    const name = ui.name.trim();
    if (!local && ui.tab === 'join' && ui.code.length !== 4) return fail('Table codes are 4 characters.');
    if (!name) return fail('Add your name so the table knows who you are.');
    if (!local && !net) return fail(ui.homeNote || 'Still connecting. Try again in a second.');
    ui.err = ''; ui.busy = true; render();
    T.store.set('chipstack:name', name);
    try {
      if (local || ui.tab === 'create') {
        const [sb, bb] = BLIND_OPTS[ui.blinds];
        const b = local ? await new T.LocalBackend().init() : net;
        const code = await b.create({ startingStack: ui.stack, sb, bb }, name);
        if (!local) T.store.set('chipstack:last', code);
        ui.view = 'room';
        attach(b);
      } else {
        await openTable(ui.code, name);
      }
    } catch (e) { ui.view = 'lobby'; S = null; fail(e.message); return; }
    ui.busy = false; render();
  }
  async function openTable(code, name) {
    const b = net;
    await b.open(code);
    T.store.set('chipstack:last', code);
    ui.view = 'auto';
    attach(b);
    if (!b.state.players.some((p) => p.id === b.me.id)) await b.submit({ type: 'join', name });
  }
  async function rejoin(code) {
    const name = ui.name.trim();
    if (!name) return fail('Add your name so the table knows who you are.');
    if (!net) return fail('Still connecting. Try again in a second.');
    ui.err = ''; ui.busy = true; render();
    T.store.set('chipstack:name', name);
    try { await openTable(code, name); } catch (e) { ui.view = 'lobby'; S = null; return fail(e.message); }
    ui.busy = false; render();
  }
  async function continueLocal() {
    try { const b = new T.LocalBackend(); await b.open(); ui.view = 'auto'; attach(b); } catch (e) { fail(e.message); }
  }
  function leaveToLobby() {
    if (backend && backend.kind !== 'local' && backend.close) backend.close();
    if (unsub) unsub();
    unsub = null; backend = null; S = null; ui.view = 'lobby'; ui.sheet = null; ui.actFor = false; ui.staged = [];
    render();
  }

  // ---------------- rendering core ----------------
  let mounted = null;
  const cache = new Map();
  function mount(name, html) {
    if (mounted === name) return false;
    mounted = name; cache.clear();
    $app.innerHTML = html;
    return true;
  }
  function patch(id, html) {
    if (cache.get(id) === html) return;
    const el = document.getElementById(id);
    if (!el) return;
    cache.set(id, html);
    const a = document.activeElement;
    const keep = a && a.id && el.contains(a) && a.tagName === 'INPUT' ? [a.id, a.selectionStart, a.selectionEnd] : null;
    el.innerHTML = html;
    if (keep) {
      const n = document.getElementById(keep[0]);
      if (n) { n.focus(); try { n.setSelectionRange(keep[1], keep[2]); } catch (e) { /* ignore */ } }
    }
  }
  function render() {
    if (!S) renderLobbyForm();
    else if (ui.view === 'room') renderRoom();
    else renderTable();
    patch('sheet', S ? sheetHTML() : '');
  }

  // scale the 800x420 artboards to their frames
  const ro = window.ResizeObserver ? new ResizeObserver((entries) => {
    for (const en of entries) {
      const el = en.target, w = el.clientWidth, h = el.clientHeight;
      el.style.setProperty('--sc', el.classList.contains('stage') ? Math.min(w / 800, h / 420) : w / 800);
    }
  }) : null;
  function observe(id) {
    const el = document.getElementById(id);
    if (!el) return;
    if (ro) ro.observe(el);
    const w = el.clientWidth, h = el.clientHeight;
    el.style.setProperty('--sc', el.classList.contains('stage') ? Math.min(w / 800, (h || 420) / 420) : w / 800);
  }

  // ---------------- lobby ----------------
  function lobbySkeleton(panelId) {

  function renderLobbyForm() {

  // ---------------- waiting room ----------------
  function renderRoom() {
    if (mount('room', lobbySkeleton('rpanel'))) observe('hero');

        : `<button id="b-seat" class="abtn submit mustard" data-a="seat">TAKE YOUR SEAT</button>`}
      ${!local && net && net.kind === 'peer' ? '<div class="extras"><button class="textlink" data-a="copy-link">Copy invite link</button></div>' : ''}`);
  }

  // ---------------- table ----------------
  const tableSkeleton = () => `<main class="tbl" id="tbl">
